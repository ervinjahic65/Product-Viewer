<p-tabView>
  <p-tabPanel header="Table View">
    <input type="text" pInputText [(ngModel)]="filterText" (input)="onFilterChange()" placeholder="Search..." class="mb-3 w-full" />
    <p-table [value]="filteredProducts" [paginator]="true" [rows]="5" sortMode="multiple">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="title">Title <p-sortIcon field="title"></p-sortIcon></th>
          <th pSortableColumn="price">Price <p-sortIcon field="price"></p-sortIcon></th>
          <th pSortableColumn="rating">Rating <p-sortIcon field="rating"></p-sortIcon></th>
          <th>Category</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-product>
        <tr>
          <td>{{ product.title }}</td>
          <td>${{ product.price }}</td>
          <td>{{ product.rating }}</td>
          <td>{{ product.category | uppercase }}</td>
        </tr>
      </ng-template>
    </p-table>
  </p-tabPanel>

  <p-tabPanel header="Snippet View">
    <input type="text" pInputText [(ngModel)]="filterText" (input)="onFilterChange()" placeholder="Search..." class="mb-3 w-full" />
    <div class="grid gap-4 snippet-view-top">
      <p-card *ngFor="let product of filteredProducts" header="{{ product.title }}" [subheader]="product.category | uppercase">
        <ng-template pTemplate="header">
          <img [src]="product.thumbnail" alt="{{ product.title }}" width="100" />
        </ng-template>
        <div class="line-clamp-2">{{ product.description }}</div>
        <div class="mt-2 font-semibold">
          ${{ product.price }} - Rating: {{ product.rating }}
        </div>
      </p-card>
    </div>
  </p-tabPanel>
</p-tabView>
